---
layout: default
---
<style>
  .post-content p { color: #aab7d1; font-size: 0.9rem; line-height: 1.8; margin-bottom: 1.25rem; }
  .post-content h1, .header-section .handle { color: #fff; font-size: 1.2rem; border-left: 3px solid var(--accent-orange); padding-left: 0.5rem; margin-top: 2.5rem; margin-bottom: 0.75rem; font-weight: 500; letter-spacing: -0.5px; line-height: 1.3; }
  .post-content h2 { color: #fff; font-size: 1.35rem; border-left: 2px solid var(--accent-blue); padding-left: 1rem; margin-left: 1rem; margin-top: 2rem; margin-bottom: 0.5rem; font-weight: 500; }
  .post-content h3 { color: #fff; font-size: 1.1rem; border-left: 2px solid var(--accent-green); padding-left: 1rem; margin-left: 2rem; margin-top: 1.75rem; margin-bottom: 0.5rem; font-weight: 500; }
  .post-content h4 { color: #fff; font-size: 1rem; border-left: 2px solid var(--accent-orange); padding-left: 1rem; margin-left: 3rem; margin-top: 1.5rem; margin-bottom: 0.5rem; font-weight: 500; }
  .post-content h1 ~ p, .post-content h1 ~ ul, .post-content h1 ~ ol, .post-content h1 ~ blockquote, .post-content h1 ~ pre, .post-content h1 ~ table { margin-left: 0.5rem; }
  .post-content h2 ~ p, .post-content h2 ~ ul, .post-content h2 ~ ol, .post-content h2 ~ blockquote, .post-content h2 ~ pre, .post-content h2 ~ table { margin-left: 1rem; }
  .post-content h3 ~ p, .post-content h3 ~ ul, .post-content h3 ~ ol, .post-content h3 ~ blockquote, .post-content h3 ~ pre, .post-content h3 ~ table { margin-left: 2rem; }
  .post-content h4 ~ p, .post-content h4 ~ ul, .post-content h4 ~ ol, .post-content h4 ~ blockquote, .post-content h4 ~ pre, .post-content h4 ~ table { margin-left: 3rem; }
  .post-content del { color: var(--accent-red); }
  .post-content code { background: var(--pill-bg); border: 1px solid var(--pill-border); padding: 0.1rem 0.4rem; border-radius: 3px; color: var(--accent-orange); font-family: "JetBrains Mono", monospace; font-size: 0.82rem; }
  .post-content pre { background: #1e1e1e; border: 1px solid #333; border-left: 3px solid var(--accent-blue); padding: 1rem 1.25rem; margin: 1.5rem 0; overflow-x: auto; border-radius: 4px; }
  .post-content pre code { background: none; border: none; color: #d4d4d4; padding: 0; font-size: 0.8rem; line-height: 1.7; font-family: "JetBrains Mono", "Fira Code", "Consolas", monospace; }
  
  /* Rouge Syntax Highlighting */
  .post-content .highlight { background: #1e1e1e; border-radius: 4px; margin: 1.5rem 0; }
  .post-content .highlight pre { background: none; border: none; margin: 0; padding: 1rem 1.25rem; }
  .post-content .highlight .c, .post-content .highlight .cm, .post-content .highlight .cp, .post-content .highlight .c1, .post-content .highlight .cs { color: #6a9955; font-style: italic; }
  .post-content .highlight .k, .post-content .highlight .kc, .post-content .highlight .kd, .post-content .highlight .kn, .post-content .highlight .kp, .post-content .highlight .kr, .post-content .highlight .kt { color: #569cd6; }
  .post-content .highlight .s, .post-content .highlight .sb, .post-content .highlight .sc, .post-content .highlight .sd, .post-content .highlight .s2, .post-content .highlight .se, .post-content .highlight .sh, .post-content .highlight .si, .post-content .highlight .sx, .post-content .highlight .sr, .post-content .highlight .s1, .post-content .highlight .ss { color: #ce9178; }
  .post-content .highlight .m, .post-content .highlight .mb, .post-content .highlight .mf, .post-content .highlight .mh, .post-content .highlight .mi, .post-content .highlight .il, .post-content .highlight .mo { color: #b5cea8; }
  .post-content .highlight .nf, .post-content .highlight .nd { color: #dcdcaa; }
  .post-content .highlight .nc, .post-content .highlight .ni, .post-content .highlight .nb, .post-content .highlight .nn { color: #4ec9b0; }
  .post-content .highlight .bp, .post-content .highlight .vc, .post-content .highlight .vg, .post-content .highlight .vi, .post-content .highlight .nv { color: #9cdcfe; }
  .post-content .highlight .o, .post-content .highlight .p { color: #d4d4d4; }
  .post-content .highlight .ow { color: #569cd6; }
  .post-content .highlight .gd, .post-content .highlight .gr, .post-content .highlight .gt, .post-content .highlight .err { color: #f48771; }
  .post-content .highlight .ge { color: #d4d4d4; font-style: italic; }
  .post-content .highlight .gh, .post-content .highlight .go, .post-content .highlight .gp, .post-content .highlight .gu { color: #d4d4d4; }
  .post-content .highlight .gi { color: #89d185; }
  .post-content .highlight .gs { color: #d4d4d4; font-weight: bold; }
  .post-content .highlight .err { background: #1e1e1e; }
  
  .post-content blockquote { background: var(--pill-bg); border-left: 3px solid var(--accent-green); padding: 0.5rem 1.25rem; margin: 1.5rem 0; border-radius: 4px; color: var(--text-muted); }
  .post-content blockquote p:last-child { margin-bottom: 0; }
  .post-content a { color: var(--accent-blue); border-bottom: 1px dashed var(--pill-border); text-decoration: none; transition: all 0.15s ease; }
  .post-content a:hover { color: #fff; border-bottom-color: var(--accent-blue); }
  .post-content ul, .post-content ol { color: var(--text-muted); padding-left: 1.75rem; margin: 1rem 0; line-height: 1.8; }
  .post-content ul li, .post-content ol li { margin-bottom: 0.3rem; }
  .post-content ul li::marker { color: var(--accent-blue); }
  .post-content ol li::marker { color: var(--accent-orange); }
  .post-content hr { border: none; border-top: 1px dashed var(--card-border); margin: 2.5rem 0; position: relative; }
  .post-content img { max-width: 100%; border: 1px solid var(--card-border); border-radius: 4px; margin: 1.5rem 0; background: var(--pill-bg); padding: 0.3rem; }
  .post-content strong { color: #fff; font-weight: 500; }
  .post-content em { color: var(--accent-blue); font-style: italic; }
  .post-content table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; font-size: 0.82rem; }
  .post-content table th { background: var(--pill-bg); color: #fff; text-align: left; padding: 0.5rem 1rem; border: 1px solid var(--pill-border); font-weight: 500; }
  .post-content table td { padding: 0.5rem 1rem; border: 1px solid var(--pill-border); color: var(--text-muted); }
  .post-content table tr:hover td { background: var(--pill-bg); }
  
  @media (max-width: 860px) {
    .post-content h1, .header-section .handle { font-size: 1.5rem; padding-left: 0.5rem; }
    .post-content h2 { font-size: 1.2rem; padding-left: 0.75rem; margin-left: 0.5rem; }
    .post-content h3 { font-size: 1rem; padding-left: 0.75rem; margin-left: 1rem; }
    .post-content h4 { font-size: 0.9rem; padding-left: 0.65rem; margin-left: 1.5rem; }
    .post-content pre { padding: 0.75rem 1rem; }
    .post-content h1 ~ p, .post-content h1 ~ ul, .post-content h1 ~ ol, .post-content h1 ~ blockquote, .post-content h1 ~ pre, .post-content h1 ~ table, .post-content h2 ~ p, .post-content h2 ~ ul, .post-content h2 ~ ol, .post-content h2 ~ blockquote, .post-content h2 ~ pre, .post-content h2 ~ table { margin-left: 0.5rem; }
    .post-content h3 ~ p, .post-content h3 ~ ul, .post-content h3 ~ ol, .post-content h3 ~ blockquote, .post-content h3 ~ pre, .post-content h3 ~ table { margin-left: 1rem; }
    .post-content h4 ~ p, .post-content h4 ~ ul, .post-content h4 ~ ol, .post-content h4 ~ blockquote, .post-content h4 ~ pre, .post-content h4 ~ table { margin-left: 1.5rem; }
  }
</style>

<article class="section-block">
  
  <a href="/projects.html" class="read-more-trigger" style="margin-bottom: 2rem; text-decoration: none;">
    <svg class="read-more-chevron" width="10" height="6" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="transform: rotate(90deg);">
      <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="read-more-label">back to projects</span>
  </a>

  <header class="header-section" style="border-bottom: 1px solid var(--card-border); padding-bottom: 1.5rem; margin-bottom: 1rem;">
    <h1 class="handle">{{ page.title }}</h1>
    <div class="role-title">{{ page.start_date | date: "%B %d, %Y" }} </div>
    {% assign words = content | number_of_words %}
    <div class="role-title" style="font-size: 0.75rem; color: var(--text-dim); margin-top: 0.3rem;">
      ~ {{ words | divided_by: 200 | plus: 1 }} min read
    </div>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

</article>
